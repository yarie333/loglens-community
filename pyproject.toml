[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens-community"
version = "0.1.0"
description = "Local-first Windows event log normalization and education tool."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "pandas==3.0.6",
    "evtx==0.13.1",
]

[project.scripts]
loglens = "loglens.cli:main"

[tool.setuptools.packages.find]
include = ["loglens*"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
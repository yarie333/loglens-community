
id: LL-DEFENSE-003
title: Windows audit policy changed
channel: Security
event_ids: [4719]

logic:
  match: {}

severity: medium
attack: [T1562.002]

consumer_text: >
  The settings that control what Windows records
  in its security logs were changed. This may
  stop the computer from recording some activity.

false_positive_note: >
  These changes may be normal when an administrator
  updates the computer or changes its settings.

next_steps:
  - Check which settings were changed.
  - Ask if someone approved the changes.
  - Make sure Windows is still recording security events.
  - Look into any changes that were not approved.

analyst_notes: >
  Review Security Event ID 4719. Examine the account
  responsible, the affected audit subcategory, and the
  changes to auditing settings. Determine whether
  successful or failed event auditing was disabled.
  Correlate with administrative activity and other
  defense evasion indicators.
